{% extends "base.html" %}
{% block content %}
<h1>Notifications</h1>
<form method="post" action="/notifications/read">
  <input type="hidden" name="csrf_token" value="{{ csrf }}"><p><button class="secondary" type="submit">Mark all as read</button></p>
</form>
<table>
  <tr><th>When</th><th>Message</th><th></th></tr>
  {% for n in items %}
  <tr>
    <td>{{ n.created_at.strftime('%Y-%m-%d %H:%M') }} UTC</td>
    <td>{% if not n.read %}<b>{{ n.message }}</b>{% else %}{{ n.message }}{% endif %}</td>
    <td><a href="/devices/{{ n.device_id }}">Open device</a></td>
  </tr>
  {% else %}<tr><td colspan="3" class="muted">Nothing yet.</td></tr>{% endfor %}
</table>
{% endblock %}
