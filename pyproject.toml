[project]
name = "firmware-updater"
version = "0.1.0"
description = "PLC Firmware Manager (demo with a simulated PLC fleet)"
requires-python = ">=3.12"
# Keep in sync with requirements.txt
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
]

[dependency-groups]
dev = ["uvicorn[standard]>=0.29", "pytest>=8"]

[tool.uv]
package = false   # an application, not a library: nothing to build or install

# Vercel: run index.py (it seeds the simulated PLCs first) instead of app/main.py.
[tool.vercel]
entrypoint = "index:app"

# Keep /static served by the app itself (the app adds its own security headers and the files live in app/static).
[tool.vercel.fastapi.static]
cdn = false
